<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Proxy and Reactive State</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                padding: 25px;
                font-family: Arial, sans-serif;
                background-color: #F8E8EC;
                color: #38232C;
            }

            h1 {
                margin-bottom: 20px;
            }

            .panel {
                margin-bottom: 20px;
                padding: 25px;
                background-color: #FFFFFF;
                border: 1px solid #E8CDD5;
                border-radius: 8px;
            }

            h2 {
                margin-bottom: 18px;
            }

            .form-group {
                margin-bottom: 18px;
            }

            label {
                display: block;
                margin-bottom: 8px;
            }

            input {
                width: 100%;
                padding: 12px;
                border: 1px solid #C58A98;
                border-radius: 5px;
                font-size: 16px;
            }

            input:focus {
                outline: 2px solid #722F45;
                outline-offset: 2px;
            }

            button {
                padding: 10px 18px;
                border: none;
                border-radius: 5px;
                background-color: #722F45;
                color: #FFFFFF;
                cursor: pointer;
            }

            button:hover {
                background-color: #5A2437;
            }

            #preview {
                margin-top: 12px;
                line-height: 1.8;
            }

            #status {
                margin-top: 12px;
            }
        </style>
    </head>

    <body>
        <h1>Proxy & Reactive State</h1>
        <section class="panel">
            <h2>Reactive Form</h2>
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>
        </section>

        <section class="panel">
            <h2>Live Preview</h2>
            <p id="preview">
                Name: Not provided<br>
                Email: Not provided
            </p>
        </section>

        <section class="panel">
            <h2>Delete Property Demonstration</h2>
            <p>Delete the email property from the reactive state.</p>
            <button id="delete-email">Delete Email Property</button>
            <p id="status"></p>
        </section>

        <script src="main.js"></script>
    </body>
</html>
