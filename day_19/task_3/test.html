<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Virtual Scrolling</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                padding: 20px;
                font-family: Arial, sans-serif;
                background-color: #F8E8EC;
                color: #38232C;
            }

            h1 {
                margin-bottom: 15px;
            }

            .scroll-info {
                margin-bottom: 15px;
                line-height: 1.6;
            }

            #scroll-viewport {
                position: relative;
                width: 100%;
                max-width: 700px;
                height: 480px;
                overflow-y: auto;
                background-color: #FFFFFF;
                border: 1px solid #E8CDD5;
                border-radius: 8px;
            }

            #scroll-spacer {
                position: relative;
                width: 100%;
            }

            #rendered-items {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                will-change: transform;
            }

            .list-item {
                height: 48px;
                padding: 0 15px;
                display: flex;
                align-items: center;
                border-bottom: 1px solid #E8CDD5;
                background-color: #FFFFFF;
            }

            .list-item:nth-child(even) {
                background-color: #FDF4F6;
            }
        </style>
    </head>

    <body>
        <h1>Virtual Scrolling - 10,000 Items</h1>
        <div class="scroll-info">
            <p>Total items: <span id="total-count">0</span></p>
            <p>Currently rendered: <span id="rendered-count">0</span></p>
            <p>Visible range: <span id="visible-range">-</span></p>
        </div>
        <div id="scroll-viewport">
            <div id="scroll-spacer">
                <div id="rendered-items"></div>
            </div>
        </div>
        <script src="virtual-scroll.js"></script>
    </body>
</html>
