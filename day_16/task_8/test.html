<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Canvas Sales Chart</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                padding: 20px;
                font-family: Arial, sans-serif;
                background-color: #F8E8EC;
                color: #38232C;
            }

            h1 {
                margin-bottom: 20px;
            }

            .chart-wrapper {
                position: relative;
                width: 100%;
                padding: 15px;
                background-color: #FFFFFF;
                border: 1px solid #E8CDD5;
                border-radius: 8px;
            }

            canvas {
                display: block;
                width: 100%;
                height: 420px;
            }

            #chart-tooltip {
                display: none;
                position: absolute;
                padding: 8px 12px;
                background-color: #38232C;
                color: #FFFFFF;
                border-radius: 5px;
                font-size: 14px;
                pointer-events: none;
                z-index: 1;
            }

            button {
                margin-top: 15px;
                padding: 10px 18px;
                border: none;
                border-radius: 5px;
                background-color: #722F45;
                color: #FFFFFF;
                cursor: pointer;
            }

            button:hover {
                background-color: #5A2437;
            }

            button:focus-visible {
                outline: 3px solid #C58A98;
                outline-offset: 2px;
            }
        </style>
    </head>
    <body>
        <h1>Monthly Sales Chart</h1>
        <div class="chart-wrapper">
            <canvas id="sales-chart"></canvas>
            <div id="chart-tooltip"></div>
        </div>
        <button id="export-chart">Export as PNG</button>
        <script src="canvas_chart.js"></script>
    </body>
</html>
