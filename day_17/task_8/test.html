<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Animation Performance</title>
        <link rel="stylesheet" href="style.css">
        <script src="animation.js" defer></script>
    </head>
    <body>
        <main>
            <h1>requestAnimationFrame & Animation Performance</h1>
            <section>
                <h2>1. Count-Up Animation</h2>
                <div class="stats">
                    <div class="stat">
                        <h3 class="count-value" data-target="100">0</h3>
                        <p>Projects</p>
                    </div>
                    <div class="stat">
                        <h3 class="count-value" data-target="250">0</h3>
                        <p>Clients</p>
                    </div>
                    <div class="stat">
                        <h3 class="count-value" data-target="500">0</h3>
                        <p>Tasks Completed</p>
                    </div>
                </div>
                <button type="button" id="start-count">Start Count-Up</button>
            </section>

            <section>
                <h2>2. Smooth Upload Progress</h2>
                <div class="progress-track" role="progressbar" aria-label="Upload progress" 
                aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="upload-progress">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <p id="upload-status">Ready to upload.</p>
                <button type="button" id="start-upload">
                    Start Upload
                </button>
            </section>

            <section>
                <h2>3 & 4. Animation Performance Comparison</h2>
                <div class="comparison">
                    <div class="animation-demo">
                        <h3>Layout Animation (left / top)</h3>
                        <div class="demo-track" id="layout-track">
                            <div class="demo-box" id="layout-box"></div>
                        </div>
                        <button type="button" id="start-layout">
                            Run Layout Animation
                        </button>
                    </div>
                    <div class="animation-demo">
                        <h3>Compositor-Friendly (transform / opacity)</h3>
                        <div class="demo-track" id="compositor-track">
                            <div class="demo-box" id="compositor-box"></div>
                        </div>
                        <button type="button" id="start-compositor">
                            Run Transform Animation
                        </button>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
