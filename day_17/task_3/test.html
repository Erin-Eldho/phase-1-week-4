<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>History and Navigation API</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 30px;
            }

            nav {
                display: flex;
                gap: 20px;
                margin-bottom: 20px;
            }

            nav a.active {
                font-weight: bold;
                color: #7b304b;
            }

            #breadcrumb {
                margin-bottom: 25px;
            }

            section {
                display: none;
            }

            section.active {
                display: block;
            }
        </style>
    </head>
    <body>
        <h1>Client-Side Router</h1>
        <nav>
            <a href="#/home" data-route="home">Home</a>
            <a href="#/about" data-route="about">About</a>
            <a href="#/services" data-route="services">Services</a>
            <a href="#/contact" data-route="contact">Contact</a>
        </nav>
        <div id="breadcrumb"></div>
        <main>
            <section id="home">
                <h2>Home</h2>
                <p>Welcome to the home page.</p>
            </section>

            <section id="about">
                <h2>About</h2>
                <p>Learn more about us.</p>
            </section>

            <section id="services">
                <h2>Services</h2>

                <label for="service-filter">Filter services:</label>
                <select id="service-filter">
                    <option value="all">All</option>
                    <option value="web">Web Development</option>
                    <option value="cloud">Cloud Solutions</option>
                    <option value="ai">AI Consulting</option>
                </select>

                <ul id="service-list">
                    <li data-category="web">Web Development</li>
                    <li data-category="cloud">Cloud Solutions</li>
                    <li data-category="ai">AI Consulting</li>
                </ul>
            </section>

            <section id="contact">
                <h2>Contact</h2>
                <p>Get in touch with us.</p>
            </section>
        </main>

        <script type="module" src="./router.js"></script>
    </body>
</html>
